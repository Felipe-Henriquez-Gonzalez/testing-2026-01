---
- name: Listen for events on a webhook from chatops
  hosts: all
  sources:
    - name: Listen for messages
      eda.builtin.webhook:
        host: 0.0.0.0
        port: 6001

  rules:
    - name: Debug evento recibido
      condition: event.payload is defined
      action:
        print_event:
          pretty: true

    - name: Ejecutar workflow cuando action sea recuperar
      condition: event.payload.action == "recuperar"
      action:
        run_workflow_template:
          name: "recuperar"
          organization: "Default"

    - name: Lanzar workflow recuperar cuando llegue action resolver
      condition: event.payload.action == "resolver"
      action:
        run_workflow_template:
          name: "resolver"
          organization: "Default"

    - name: Lanzar workflow mas info
      condition: event.payload.action == "mas-info"
      action:
        run_workflow_template:
          name: "mas-info"
          organization: "Default"
